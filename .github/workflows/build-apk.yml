name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key (optional, from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.R95_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/r95.jks" && echo "R95_KEYSTORE=$RUNNER_TEMP/r95.jks" >> "$GITHUB_ENV" && echo "release key: yes"; else echo "release key: none (debug-signed)"; fi

      - name: Bundle the emulator cores into the VHS launcher (arm64 phones; others download on first use)
        run: |
          set -e
          d=app/src/vhs/assets/cores/arm64-v8a
          mkdir -p "$d"
          for c in fceumm snes9x gambatte mgba mupen64plus_next_gles3; do
            curl -fsSL --retry 3 -o /tmp/$c.zip "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${c}_libretro_android.so.zip" || { echo "skip $c"; continue; }
            unzip -o -q /tmp/$c.zip -d "$d" || true
          done
          ls -la "$d"

      - name: Build debug and release APKs
        env:
          R95_STORE_PASS: ${{ secrets.R95_STORE_PASS }}
          R95_KEY_ALIAS: ${{ secrets.R95_KEY_ALIAS }}
          R95_KEY_PASS: ${{ secrets.R95_KEY_PASS }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleVhsRelease assembleVhsnotifRelease
          mkdir -p dist dist-notif
          cp app/build/outputs/apk/vhs/release/*.apk dist/REVERENDER_95-VHS.apk
          # VHS+ : the same launcher with the notification area (notification access), a separate app
          cp app/build/outputs/apk/vhsnotif/release/*.apk dist-notif/REVERENDER_95-VHS-PLUS-NOTIFICATIONS.apk
          # what each APK asks for, and which key signed it
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for a in dist/*.apk dist-notif/*.apk; do echo "== $a"; "$BT/aapt" dump permissions "$a" | grep -o "name='[^']*'" | sort -u || true
            "$BT/apksigner" verify --print-certs "$a" | grep -E "certificate DN|SHA-256" | head -2 || true; done

      - name: Check old-device compatibility (Android 5.0+ API usage)
        if: always()
        run: |
          ./gradlew --no-daemon lintVhsDebug > /dev/null 2>&1 || true
          f=app/build/reports/lint-results-vhsDebug.txt
          if [ -f "$f" ]; then grep -B1 -A3 "NewApi\|InlinedApi" "$f" | head -80 || true; else echo "lint report not found"; fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: REVERENDER95-VHS-apk
          path: |
            dist/*.apk
            dist-notif/*.apk
          if-no-files-found: error
          retention-days: 1

      # "[notif-only]" in the commit message: only the VHS+ APK changed, the plain VHS APK on the release stays as it was
      - name: Publish "latest" release with the APK
        if: github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[notif-only]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: REVERENDER_95 VHS launcher — latest build
          prerelease: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the VHS+ (notifications) APK to "latest"
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: REVERENDER_95 VHS launcher — latest build
          prerelease: true
          files: dist-notif/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: write
