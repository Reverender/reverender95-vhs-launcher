name: Store material

# Screenshots and screen recordings of the Google Play edition for the store listing.
# Run it from the Actions tab; the results land on the ui-results branch (store/).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "tail = only the VHS WEB and LOAD parts; tour = help-tour screenshots"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Play edition APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x ./gradlew
          ./gradlew --no-daemon assemblePlayRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Shots and recordings on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          disk-size: 4096M
          ram-size: 3072M
          script: ONLY="${{ inputs.only }}" timeout 35m bash .github/scripts/store.sh 2>&1 | tee /tmp/store-report.txt; mkdir -p store; cp /tmp/store-report.txt store/report.txt
      - name: Publish to the ui-results branch
        if: always()
        run: |
          git config user.name "ui-test"; git config user.email "lowram@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r store /tmp/out/
          git fetch origin ui-results:ui-results 2>/dev/null || true
          if git show-ref --quiet refs/heads/ui-results; then git checkout -f ui-results && git clean -fdq; else git checkout --orphan ui-results; git rm -rf . > /dev/null; fi
          rm -rf store && cp -r /tmp/out/store . && git add store && git commit -qm "store run ${{ github.run_id }}" && git push origin ui-results || true
