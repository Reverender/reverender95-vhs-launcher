name: UI check

# Boots an emulator with 1 GB of RAM, runs the app through its heaviest windows and reports
# memory use, frame timing, low-memory kills and crashes. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "notif = only the VHS+ part"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release-like debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleVhsRelease assembleVhsnotifRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Profile on a low-end emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 2048M
          ram-size: 2048M
          heap-size: 128M
          script: ONLY="${{ inputs.only }}" timeout 30m bash .github/scripts/ui.sh 2>&1 | tee /tmp/ui-report.txt; mkdir -p ui; cp /tmp/ui-report.txt ui/report.txt
      - name: CRT curve on Android 14 (GPU shader)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 2048M
          ram-size: 2048M
          script: timeout 8m bash .github/scripts/ui-curve.sh 2>&1 | tee ui/curve-report.txt
      - name: Publish results to the ui-results branch
        if: always()
        run: |
          git config user.name "ui-test"; git config user.email "lowram@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r ui /tmp/out/
          git fetch origin ui-results:ui-results 2>/dev/null || true
          if git show-ref --quiet refs/heads/ui-results; then git checkout -f ui-results && git clean -fdq; else git checkout --orphan ui-results; git rm -rf . > /dev/null; fi
          rm -rf ui && cp -r /tmp/out/ui . && git add ui && git commit -qm "ui run ${{ github.run_id }}" && git push origin ui-results || true
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: ui-results
          path: ui/
